[package]
name = "terra-rs"
description = "A Terraria character editor written in Rust"
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
repository.workspace = true
default-run = "terra-rs"

[dependencies]
terra-core = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
once_cell = { workspace = true }
image = { workspace = true }
flume = "0.12.0"
eframe = { version = "0.33", features = ["persistence"] }
egui = { version = "0.33", features = ["color-hex"] }
catppuccin-egui = { version = "5.7", default-features = false, features = [
    "egui33",
] }
egui_dock = { version = "0.18", features = ["serde"] }
rfd = "0.17.2"
parking_lot = "0.12.5"
webbrowser = "1.1.0"
log = "0.4.29"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.9"
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "fs"] }
time = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.64"
serde-wasm-bindgen = "0.6.5"
web-sys = { version = "0.3.91", features = ["Window", "Navigator", "Request", "RequestInit", "Response"] }
time = { workspace = true, features = ["wasm-bindgen"] }

[[bin]]
name = "terra-rs"
path = "src/main.rs"
